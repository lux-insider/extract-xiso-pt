[package]
name = "extract-xiso-pt"
version = "0.1.0"
edition = "2024"
description = "Lista, extrai, cria, otimiza e verifica imagens de disco de Xbox e Xbox 360 (XDVDFS), em português"
license = "MIT"

[dependencies]
# CLI: subcomandos e argumentos
clap = { version = "4", features = ["derive"] }
# Erros
thiserror = "1"
# Protocolo de progresso estruturado (--progresso-json) e `listar --json`
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Interface de terminal: largura visível de texto com emoji e tamanho do terminal
unicode-width = "0.2.2"
terminal_size = "0.4.4"
# `verificar`: CRC32, MD5 e SHA-1 da imagem (os hashes dos .dat do Redump)
crc32fast = "1"
md-5 = "0.11.0"
sha1 = "0.11.0"
# `crate::sistema`: espaço livre (statvfs) e Ctrl+C/SIGTERM limpos (sigaction)
libc = "0.2"

# Só no Windows: sequências ANSI e UTF-8 no console, espaço livre e Ctrl+C.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader"] }

# Binário pequeno: otimiza para tamanho, LTO completo, uma unidade de código,
# sem tabelas de unwind e sem símbolos.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

