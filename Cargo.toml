[package]
name = "extract-xiso-pt"
version = "0.2.2"
edition = "2024"
description = "Lista, extrai, cria, otimiza e verifica imagens de disco de Xbox e Xbox 360 (XDVDFS), em português"
license = "MIT"

[dependencies]
# CLI: subcomandos e argumentos
clap = { version = "4", features = ["derive"] }
# Erros
thiserror = "1"
# Protocolo de progresso estruturado (--progresso-json) e `listar --json`
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Interface de terminal: largura visível de texto com emoji (o tamanho do
# terminal vem direto de libc/windows-sys, sem outro crate)
unicode-width = "0.2.2"
# `verificar`: CRC32, MD5 e SHA-1 da imagem (os hashes dos .dat do Redump)
crc32fast = "1"
md-5 = "0.11.0"
sha1 = "0.11.0"
# `dats instalar`: lê os .zip que o Redump entrega (deflate)
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
# `crate::sistema`: espaço livre (statvfs) e Ctrl+C/SIGTERM limpos (sigaction);
# `crate::terminal`: largura do terminal (ioctl TIOCGWINSZ)
libc = "0.2"

# Só no Windows: sequências ANSI e UTF-8 no console, espaço livre e Ctrl+C.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_LibraryLoader"] }

# Binário pequeno: otimiza para tamanho, LTO completo, uma unidade de código,
# sem tabelas de unwind e sem símbolos.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Os hashes do `verificar` são o único trecho pesado de CPU: otimizados para
# velocidade. Numa CPU sem SHA-NI, o SHA-1 compilado para tamanho deixava o
# `verificar` 45% mais lento (2,95 s contra 2,03 s por GiB), e isto não
# aumenta o binário. Com SHA-NI o gargalo é o MD5 e nada muda.
[profile.release.package.md-5]
opt-level = 3
[profile.release.package.sha1]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
[profile.release.package.digest]
opt-level = 3
[profile.release.package.block-buffer]
opt-level = 3

